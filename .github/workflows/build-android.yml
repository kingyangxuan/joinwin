name: Build Android APK (Pure React Native)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Create pure React Native project
        run: |
          # 用 react-native init 创建标准项目（不依赖 expo）
          npx react-native@0.74.5 init JoinwinApp --version 0.74.5 --skip-install
          cd JoinwinApp
          # 替换为我们的最简 App
          cat > App.js << 'EOF'
import React from 'react';
import { View, Text, StyleSheet } from 'react-native';

export default function App() {
  return (
    <View style={styles.container}>
      <Text style={styles.text}>Joinwin 启动成功！</Text>
    </View>
  );
}

const styles = StyleSheet.create({
  container: {
    flex: 1,
    justifyContent: 'center',
    alignItems: 'center',
    backgroundColor: '#FFFFFF',
  },
  text: {
    fontSize: 24,
    fontWeight: 'bold',
    color: '#F97316',
  },
});
EOF
          # 修改应用名和包名
          sed -i 's/JoinwinApp/Joinwin/g' android/app/src/main/AndroidManifest.xml
          sed -i 's/com.joinwinapp/com.joinwin/g' android/app/build.gradle
          sed -i 's/com.joinwinapp/com.joinwin/g' android/app/src/main/AndroidManifest.xml
          # 修改包名目录
          mkdir -p android/app/src/main/java/com/joinwin
          cp android/app/src/main/java/com/joinwinapp/*.kt android/app/src/main/java/com/joinwin/ 2>/dev/null || true
          sed -i 's/package com.joinwinapp/package com.joinwin/g' android/app/src/main/java/com/joinwin/*.kt
          rm -rf android/app/src/main/java/com/joinwinapp
          echo "项目创建完成"
          ls -la

      - name: Install dependencies
        run: |
          cd JoinwinApp
          npm install

      - name: Build Debug APK
        run: |
          cd JoinwinApp/android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Build Release APK
        run: |
          cd JoinwinApp/android
          ./gradlew assembleRelease --no-daemon

      - name: Rename APKs
        run: |
          mv JoinwinApp/android/app/build/outputs/apk/debug/app-debug.apk JoinwinApp/android/app/build/outputs/apk/debug/joinwin-debug.apk
          mv JoinwinApp/android/app/build/outputs/apk/release/app-release.apk JoinwinApp/android/app/build/outputs/apk/release/joinwin-release.apk

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: joinwin-debug-apk
          path: JoinwinApp/android/app/build/outputs/apk/debug/joinwin-debug.apk

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: joinwin-release-apk
          path: JoinwinApp/android/app/build/outputs/apk/release/joinwin-release.apk
