name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install

      - name: Prebuild Android
        run: npx expo prebuild --platform android --no-install

      - name: Fix Gradle and AGP versions for compatibility
        run: |
          # 降级 Gradle 到 8.6
          echo "distributionUrl=https\://services.gradle.org/distributions/gradle-8.6-all.zip" > android/gradle/wrapper/gradle-wrapper.properties
          # 降级 AGP 到 8.2.0
          sed -i 's/com.android.tools.build:gradle:[0-9.]*/com.android.tools.build:gradle:8.2.0/g' android/build.gradle
          sed -i 's/com.android.application version [0-9.]*/com.android.application version 8.2.0/g' android/build.gradle
          echo "=== android/build.gradle ==="
          cat android/build.gradle
          echo "=== gradle-wrapper.properties ==="
          cat android/gradle/wrapper/gradle-wrapper.properties

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Build Release APK
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon

      - name: Rename APKs
        run: |
          mv android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/debug/joinwin-debug.apk
          mv android/app/build/outputs/apk/release/app-release.apk android/app/build/outputs/apk/release/joinwin-release.apk

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: joinwin-debug-apk
          path: android/app/build/outputs/apk/debug/joinwin-debug.apk

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: joinwin-release-apk
          path: android/app/build/outputs/apk/release/joinwin-release.apk
