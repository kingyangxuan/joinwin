name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Init React Native project
        run: npx react-native@0.74.5 init JoinwinApp --version 0.74.5 --directory JoinwinApp --skip-install

      - name: Copy full app source
        run: |
          cp full-app/App.js JoinwinApp/App.js
          mkdir -p JoinwinApp/src
          cp -r full-app/src/* JoinwinApp/src/
          echo "源码复制完成"
          ls -la JoinwinApp/src/screens/

      - name: Rename package
        run: |
          cd JoinwinApp
          sed -i 's/com.joinwinapp/com.joinwin/g' android/app/build.gradle
          sed -i 's/com.joinwinapp/com.joinwin/g' android/app/src/main/AndroidManifest.xml
          mkdir -p android/app/src/main/java/com/joinwin
          cp android/app/src/main/java/com/joinwinapp/*.kt android/app/src/main/java/com/joinwin/
          sed -i 's/package com.joinwinapp/package com.joinwin/g' android/app/src/main/java/com/joinwin/*.kt
          rm -rf android/app/src/main/java/com/joinwinapp
          sed -i 's/JoinwinApp/Joinwin/g' android/app/src/main/AndroidManifest.xml

      - name: Install dependencies
        run: |
          cd JoinwinApp
          npm install
          npm install @react-navigation/native@^6.1.18 @react-navigation/native-stack@^6.11.0 react-native-screens@~3.31.1 react-native-safe-area-context@4.10.5 react-native-gesture-handler@~2.16.1 @react-native-async-storage/async-storage@1.23.1

      - name: Build Debug APK
        run: |
          cd JoinwinApp/android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Build Release APK
        run: |
          cd JoinwinApp/android
          ./gradlew assembleRelease --no-daemon

      - name: Rename APKs
        run: |
          cp JoinwinApp/android/app/build/outputs/apk/debug/app-debug.apk joinwin-debug.apk
          cp JoinwinApp/android/app/build/outputs/apk/release/app-release.apk joinwin-release.apk

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: joinwin-debug-apk
          path: joinwin-debug.apk

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: joinwin-release-apk
          path: joinwin-release.apk
